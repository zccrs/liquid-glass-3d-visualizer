name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main, feature/texture-refraction-upload]
    paths: ['index.html', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject version tag
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          sed -i "s|<div id=\"versionTag\">dev</div>|<div id=\"versionTag\">$SHORT_SHA</div>|" index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
